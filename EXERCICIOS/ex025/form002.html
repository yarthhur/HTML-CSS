<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="usu">Usuário:</label>


            <input type="text" name="usu" id="usu" required minlength="5" maxlength="15" size="15" placeholder="Nome do Usuário" autocomplete="username">
            
            <input type="reset" value="Limpar">

        </p>
        <p>
            <label for="sen">Senha:</label>
            <input type="password" name="sen" id="sen" required minlength="8" maxlength="20" size="8" placeholder="Senha" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            
        </p>
    </form>
</body>
</html>
